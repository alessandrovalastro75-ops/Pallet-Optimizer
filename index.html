<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PalletOptimizer Pro</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 p-2 rounded-xl text-slate-950 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
                        PalletOptimizer <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded font-mono">PRO</span>
                    </h1>
                    <p class="text-xs text-slate-400">Ottimizzazione e Gestione Distinte</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openCatalogModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition">
                    📦 Catalogo (<span id="catalogCount">0</span>)
                </button>
                <button onclick="printReport()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2 rounded-lg text-slate-300 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6 pb-24">
        <!-- 1. Campi Cliente e Ordine -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-3">1. Dati di Riferimento Spedizione</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cliente</label>
                    <input type="text" id="orderClient" placeholder="Nome Cliente / Azienda" oninput="saveOrderMeta()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ordine</label>
                    <input type="text" id="orderNumber" placeholder="Riferimento Ordine / DDT" oninput="saveOrderMeta()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>
        </div>

        <!-- 2. Seleziona Articoli da Spedire -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">2. Seleziona Articoli da Spedire</h2>
                <div class="flex items-center gap-2">
                    <button onclick="openNewArticleModal()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">+ Nuovo</button>
                    <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">Esporta JSON</button>
                    <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 cursor-pointer transition">
                        Importa <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Griglia Articoli Disponibili -->
            <div id="articlesSelectionGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Generato da JS -->
            </div>

            <!-- Pannello Articolo Selezionato e Quantità -->
            <div id="selectedArticlePanel" class="bg-slate-950 border border-slate-800 rounded-xl p-3 hidden space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-xs text-amber-400 font-bold uppercase">Articolo Selezionato</div>
                        <div id="selArtName" class="text-sm font-semibold text-white">---</div>
                        <div id="selArtInfo" class="text-xs text-slate-400">---</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="adjustQty(-1)" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-lg font-bold flex items-center justify-center">-</button>
                        <input type="number" id="selArtQty" value="1" min="1" class="w-16 bg-slate-900 border border-slate-700 text-center rounded-lg py-2 text-sm font-bold focus:outline-none focus:border-amber-500">
                        <button onclick="adjustQty(1)" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-lg font-bold flex items-center justify-center">+</button>
                    </div>
                </div>
                <!-- Pulsante inserisci in distinta sotto -->
                <button onclick="addToManifest()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Inserisci in Distinta di Carico
                </button>
            </div>
        </div>

        <!-- 3. Distinta Colli Attuale -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">3. Distinta Colli Inseriti</h2>
                <span id="manifestCountBadge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">0 colli</span>
            </div>
            <div id="manifestList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <div class="text-center py-6 text-slate-500 text-sm">Nessun articolo inserito nella distinta.</div>
            </div>
        </div>

        <!-- 4. Parametri Pedana e Calcola (In fondo alla schermata) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">4. Parametri & Ottimizzazione</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Formato Pedana</label>
                    <select id="palletSize" class="w
